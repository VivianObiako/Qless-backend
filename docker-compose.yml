services:
  # The API as production runs it, from the same Dockerfile. `docker compose up`
  # starts both services; `make up` starts only the database, for working on
  # the API itself with `make api`.
  api:
    build: .
    container_name: qless-api
    environment:
      DATABASE_URL: postgres://qless:qless@db:5432/qless?sslmode=disable
      ALLOWED_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    # Same major version as production on Neon.
    image: postgres:18-alpine
    container_name: qless-db
    environment:
      POSTGRES_USER: qless
      POSTGRES_PASSWORD: qless
      POSTGRES_DB: qless
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 images keep data in a versioned folder under
      # /var/lib/postgresql, so the volume mounts there. It is a new volume:
      # data from another major version cannot be opened in place, and the old
      # qless-pgdata volume is left alone rather than overwritten.
      - qless-pgdata18:/var/lib/postgresql
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qless -d qless"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  qless-pgdata18:
