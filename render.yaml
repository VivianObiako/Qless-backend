# Render Blueprint for the Qless API.
#
# No database is declared here on purpose: Postgres lives on Neon, whose free
# tier does not expire, while Render's own free Postgres is time-limited. That
# makes DATABASE_URL an ordinary secret set in the dashboard rather than a
# value Render wires up for us.
services:
  - type: web
    name: qless-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Neon direct (unpooled) connection string. Needs sslmode=require.
      - key: DATABASE_URL
        sync: false
      # Comma-separated web origins: the Vercel production domain first, then
      # any preview domain that should be able to reach this API. The first
      # one is also where a tapped push notification lands.
      - key: ALLOWED_ORIGIN
        sync: false
      # Web Push. Optional: without a key pair the API runs and the customer's
      # pass nudges from the page instead. Mint a pair once with
      # `go run ./cmd/vapid`; the private key is a secret, and rotating it
      # invalidates every existing subscription.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # A mailto: or https: contact sent to the push services with each
      # notification, so they can reach you if the server misbehaves.
      - key: VAPID_SUBJECT
        sync: false

  # The same API in Frankfurt, beside the Neon database in AWS Europe Central 1
  # and closer to West Africa. A Render service cannot change region, so the
  # move is a second service; the Oregon entry above goes once this one has
  # taken over. Copy every secret from the Oregon service unchanged except
  # DATABASE_URL, which points at the Frankfurt database. New VAPID keys would
  # silently break every existing push subscription.
  - type: web
    name: qless-api-eu
    region: frankfurt
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
